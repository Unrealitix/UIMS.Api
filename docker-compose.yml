version: '3.8'
services:
  api:
    image: unrealitix/vanir
    environment:
      - DB_SCHEMA=uims
      - DB_USER=postgres
      - DB_PASS=${POSTGRES_PASSWORD}
    ports:
      - '8080:80'
    depends_on:
      - db
  
  db:
    image: postgres:14.1-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
volumes:
  db:
    driver: local
